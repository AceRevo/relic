<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a0f"/>
      <stop offset="50%" stop-color="#0b1019"/>
      <stop offset="100%" stop-color="#040608"/>
    </linearGradient>
    <linearGradient id="neon-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fcee0a"/>
      <stop offset="100%" stop-color="#ff7b00"/>
    </linearGradient>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 240, 255, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bg-grad)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>

  <!-- Decorative Circuit Traces -->
  <g stroke="#00f0ff" stroke-width="1.5" fill="none" opacity="0.3" filter="url(#glow-cyan)">
    <path d="M 50 80 L 180 80 L 220 120 L 400 120" />
    <path d="M 120 40 L 120 160 L 160 200 L 280 200" />
    <circle cx="400" cy="120" r="4" fill="#00f0ff"/>
    <circle cx="280" cy="200" r="4" fill="#00f0ff"/>
    
    <path d="M 800 300 L 920 300 L 960 260 L 1150 260" />
    <path d="M 980 360 L 1020 320 L 1150 320" />
    <circle cx="800" cy="300" r="4" fill="#00f0ff"/>
  </g>

  <!-- Geometric Tech Accents -->
  <g stroke="#fcee0a" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 30 30 L 60 30" />
    <path d="M 30 30 L 30 60" />
    <path d="M 1170 30 L 1140 30" />
    <path d="M 1170 30 L 1170 60" />
    <path d="M 30 390 L 60 390" />
    <path d="M 30 390 L 30 360" />
    <path d="M 1170 390 L 1140 390" />
    <path d="M 1170 390 L 1170 360" />
  </g>

  <!-- Central Chip Symbol -->
  <g transform="translate(140, 150)">
    <!-- Outer Shield -->
    <polygon points="60,0 120,35 120,105 60,140 0,105 0,35" fill="rgba(11, 16, 25, 0.8)" stroke="#fcee0a" stroke-width="2.5" filter="url(#glow-gold)"/>
    <!-- Inner Core -->
    <polygon points="60,20 100,45 100,95 60,120 20,95 20,45" fill="none" stroke="#00f0ff" stroke-width="1.5" filter="url(#glow-cyan)"/>
    <circle cx="60" cy="70" r="14" fill="#fcee0a" filter="url(#glow-gold)"/>
    <!-- Data Node lines -->
    <line x1="60" y1="0" x2="60" y2="20" stroke="#fcee0a" stroke-width="2"/>
    <line x1="120" y1="70" x2="100" y2="70" stroke="#00f0ff" stroke-width="2"/>
    <line x1="0" y1="70" x2="20" y2="70" stroke="#00f0ff" stroke-width="2"/>
    <line x1="60" y1="140" x2="60" y2="120" stroke="#fcee0a" stroke-width="2"/>
  </g>

  <!-- Typography: Header & Titles -->
  <g font-family="'JetBrains Mono', 'Segoe UI', monospace">
    <!-- Top System Tag -->
    <text x="320" y="115" font-size="13" font-weight="700" fill="#00f0ff" letter-spacing="4" filter="url(#glow-cyan)">
      [ SYS_REANIMATION_PROTOCOL // LEVEL-0 BARE-METAL ]
    </text>

    <!-- Main Title -->
    <text x="315" y="195" font-size="76" font-weight="900" fill="url(#neon-gold)" letter-spacing="6" filter="url(#glow-gold)">
      PROJECT RELIC
    </text>

    <!-- Subtitle -->
    <text x="320" y="240" font-size="20" font-weight="600" fill="#e0e6ed" letter-spacing="3">
      AUTONOMOUS BARE-METAL SYSTEM RECOVERY ENGINE
    </text>

    <!-- Description -->
    <text x="320" y="275" font-size="14" font-weight="400" fill="#7d8b99" letter-spacing="1">
      Written in pure Rust. Hardware-accelerated block streaming, instant RAM overlay, and zero-compromise state restoration.
    </text>

    <!-- Tech Badges inside Banner -->
    <g transform="translate(320, 315)">
      <!-- Badge 1: Rust -->
      <rect x="0" y="0" width="130" height="34" rx="4" fill="rgba(252, 238, 10, 0.1)" stroke="#fcee0a" stroke-width="1"/>
      <text x="65" y="22" font-size="12" font-weight="700" fill="#fcee0a" text-anchor="middle">RUST 2021</text>

      <!-- Badge 2: Speed -->
      <rect x="145" y="0" width="160" height="34" rx="4" fill="rgba(0, 240, 255, 0.1)" stroke="#00f0ff" stroke-width="1"/>
      <text x="225" y="22" font-size="12" font-weight="700" fill="#00f0ff" text-anchor="middle">USB4 / 3.2 GB/s</text>

      <!-- Badge 3: Engine -->
      <rect x="320" y="0" width="150" height="34" rx="4" fill="rgba(255, 255, 255, 0.05)" stroke="#667788" stroke-width="1"/>
      <text x="395" y="22" font-size="12" font-weight="700" fill="#d0dbe5" text-anchor="middle">ZSTD STREAM</text>

      <!-- Badge 4: Integrity -->
      <rect x="485" y="0" width="165" height="34" rx="4" fill="rgba(0, 255, 136, 0.1)" stroke="#00ff88" stroke-width="1"/>
      <text x="567" y="22" font-size="12" font-weight="700" fill="#00ff88" text-anchor="middle">BLAKE3 VERIFIED</text>
    </g>
  </g>

  <!-- Right Side Status Box (HUD telemetry) -->
  <g transform="translate(1000, 60)" font-family="'JetBrains Mono', monospace">
    <rect width="160" height="110" rx="4" fill="rgba(5, 10, 15, 0.7)" stroke="#00f0ff" stroke-width="1" opacity="0.6"/>
    <text x="15" y="25" font-size="10" fill="#00f0ff">STATUS: ARMED</text>
    <text x="15" y="45" font-size="10" fill="#7d8b99">BLOCKS: ATOMIC</text>
    <text x="15" y="65" font-size="10" fill="#7d8b99">LATENCY: &lt;1.2ms</text>
    <text x="15" y="85" font-size="10" fill="#fcee0a">ENGRAM: READY</text>
  </g>
</svg>
